<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animal Games - Faction Focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/animal.css" />
</head>
<body data-faction="astral-wardens">
  <header class="hero" role="banner">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-top-actions">
        <a class="action-btn text-btn back-btn" href="../index.html">Back to Main Page</a>
        <button id="readerThemeToggle" class="action-btn icon-btn" type="button">Light</button>
      </div>
      <p class="eyebrow">Animal Games Reader</p>
      <h1 class="title">Day Story Reader</h1>
      <p class="subtitle" id="subtitle">
        Maze-style controls with day navigation, world switching, readable text modes, and reader themes.
      </p>
    </div>
  </header>

  <main class="layout reader-layout">
    <section class="timeline-panel" id="readerPanel" aria-label="Day reader">
      <div class="timeline-head">
        <h2 id="readerTitle">Day Reader</h2>
        <div class="head-actions reader-day-nav">
          <button id="readerPrevDayBtn" class="action-btn mode-btn" type="button">← Previous Day</button>
          <button id="readerNextDayBtn" class="action-btn mode-btn" type="button">Next Day →</button>
        </div>
      </div>
      <div class="reader-toolbar" aria-label="Reader tools">
        <div class="reader-tools-left">
          <button id="readerFontDown" class="action-btn text-btn" type="button">A-</button>
          <button id="readerFontUp" class="action-btn text-btn" type="button">A+</button>
          <label for="readerSearchInput" class="reader-inline-label">Search</label>
          <input id="readerSearchInput" class="reader-search" type="search" placeholder="Search this day..." autocomplete="off" spellcheck="false" />
        </div>
        <div class="reader-tools-right">
          <div class="toolbar-chip" id="focusLabel">Character: none</div>
          <div class="toolbar-chip" id="progressLabel">Day 1 - 0%</div>
          <label for="characterPicker" class="reader-inline-label">Character</label>
          <select id="characterPicker" class="action-btn text-btn">
            <option value="">Character: none</option>
          </select>
          <label for="readerFactionSelect" class="reader-inline-label">Faction</label>
          <select id="readerFactionSelect" class="action-btn text-btn"></select>
          <button id="readerWidthToggle" class="action-btn text-btn" type="button">Width: Narrow</button>
          <details class="reader-settings" id="readerSettings">
            <summary class="action-btn text-btn">Settings</summary>
            <div class="reader-settings-panel">
              <label class="reader-settings-row"><input type="radio" name="readerMode" value="paged" /> Paged mode (single day)</label>
              <label class="reader-settings-row"><input type="radio" name="readerMode" value="infinite" /> Infinite mode (all available days)</label>
              <p class="reader-settings-note">Both modes use full-page scrolling, not inner-container scrolling.</p>
            </div>
          </details>
        </div>
      </div>
      <p class="panel-note" id="readerMeta"></p>
      <div class="reader-body" id="readerBody"></div>
    </section>
  </main>

  <script src="./js/animal.js" defer></script>
</body>
</html>
